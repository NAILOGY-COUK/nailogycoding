name: Theme Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run Shopify Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error
